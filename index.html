<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Керування охороною ESP32</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Система охорони ESP32</h1>
    <div id="homeSvg">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
</svg>
</div>

    <div>
        <div id="status">Статус: Відключено</div>
    </div>

    <div>
        <button id="connectBtn">Підключити ESP32</button>
    </div>

    <div id="buttons">
        <button id="armBtn">Під охорону </button>
        <hr>
        <button id="disarmBtn">З охорони </button>
    
    </div>
    
    

   <script>
   const ESP32_IP = "http://192.168.0.112"; // Заміни на IP зі свого Serial Monitor

const connectBtn = document.getElementById("connectBtn");
const armBtn = document.getElementById("armBtn");
const disarmBtn = document.getElementById("disarmBtn");
const statusDiv = document.getElementById("status");
const homeSvg = document.getElementById("homeSvg");

let connected = false;

function showStatus(status) {
    if (status === "STATUS:DISARMED") {
        statusDiv.innerText = "Система знята з охорони";
        statusDiv.style.background = "#16a34a";
        homeSvg.style.color = "#86efac";
    } else if (status === "STATUS:ARMING") {
        statusDiv.innerText = "Підготовка датчика...";
        statusDiv.style.background = "#d97706";
        homeSvg.style.color = "#fbbf24";
    } else if (status === "STATUS:ARMED") {
        statusDiv.innerText = "Охорона активна";
        statusDiv.style.background = "#d97706";
        homeSvg.style.color = "#fbbf24";
    } else if (status === "STATUS:ALARM") {
        statusDiv.innerText = "ТРИВОГА! ВИЯВЛЕНО РУХ!";
        statusDiv.style.background = "#dc2626";
        homeSvg.style.color = "#f87171";
    }
}

async function requestESP32(endpoint) {
    const response = await fetch(`${ESP32_IP}/${endpoint}`);
    if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
    }
    return (await response.text()).trim();
}

connectBtn.addEventListener("click", async () => {
    statusDiv.innerText = "Підключення до ESP32...";

    try {
        const result = await requestESP32("status");

        connected = true;
        connectBtn.innerText = "ESP32 підключено";
        showStatus(result);
    } catch (error) {
        connected = false;
        statusDiv.innerText =
            "Не вдалося підключитися. Перевір Wi-Fi та IP ESP32.";
        console.error("Помилка підключення:", error);
    }
});

armBtn.addEventListener("click", async () => {
    if (!connected) {
        alert("Спочатку натисни «Підключити ESP32».");
        return;
    }

    try {
        showStatus(await requestESP32("arm"));
    } catch (error) {
        statusDiv.innerText = "Помилка надсилання команди";
        console.error(error);
    }
});

disarmBtn.addEventListener("click", async () => {
    if (!connected) {
        alert("Спочатку натисни «Підключити ESP32».");
        return;
    }

    try {
        showStatus(await requestESP32("disarm"));
    } catch (error) {
        statusDiv.innerText = "Помилка надсилання команди";
        console.error(error);
    }
});

// Оновлюємо стан, навіть якщо тривога виникла без натискання кнопки
setInterval(async () => {
    if (!connected) return;

    try {
        showStatus(await requestESP32("status"));
    } catch (error) {
        connected = false;
        statusDiv.innerText = "З'єднання з ESP32 втрачено";
        connectBtn.innerText = "Підключити ESP32";
        console.error(error);
    }
}, 1000);

</script>
</body>
</html>
